name: RSS Label Maker Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 1.0.1)"
        required: true
        default: "1.0.1"
        type: string

permissions:
  contents: write

jobs:
  release-windows:
    name: Package and publish Windows x64 release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Derive release version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
            throw "Tag must be vMAJOR.MINOR.PATCH (optional fourth component)."
          }
          "RLM_VERSION=$version" >> $env:GITHUB_ENV

      - name: Restore
        run: dotnet restore .\RSS.LabelMaker.sln -r win-x64

      - name: Publish self-contained single-file application
        run: >-
          dotnet publish .\src\RSS.LabelMaker.App\RSS.LabelMaker.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -p:Version=${{ env.RLM_VERSION }}
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o .\artifacts\publish

      - name: Package and checksum
        shell: pwsh
        run: |
          $exe = ".\artifacts\publish\RSS.LabelMaker.exe"
          if (!(Test-Path $exe)) { throw "Published executable missing." }
          Compress-Archive -Path $exe -DestinationPath ".\artifacts\RSS-Label-Maker-win-x64.zip" -Force
          $hash = (Get-FileHash ".\artifacts\RSS-Label-Maker-win-x64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RSS-Label-Maker-win-x64.zip" | Set-Content ".\artifacts\RSS-Label-Maker-win-x64.zip.sha256" -NoNewline

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RLM_VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            artifacts/RSS-Label-Maker-win-x64.zip
            artifacts/RSS-Label-Maker-win-x64.zip.sha256
