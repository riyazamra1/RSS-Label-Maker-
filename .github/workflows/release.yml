name: RSS Label Maker Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  release-windows:
    name: Build and publish Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Derive release version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
            throw "Tag must be vMAJOR.MINOR.PATCH (optional fourth component)."
          }
          $parts = $version.Split('.')
          if ($parts.Count -eq 3) { $fileVersion = "$version.0" } else { $fileVersion = $version }
          "RLM_VERSION=$version" >> $env:GITHUB_ENV
          "RLM_FILE_VERSION=$fileVersion" >> $env:GITHUB_ENV
      - name: Restore
        run: dotnet restore .\RSS.LabelMaker.sln -r win-x64
      - name: Publish self-contained Windows x64 application
        run: >-
          dotnet publish .\src\RSS.LabelMaker.App\RSS.LabelMaker.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -p:Version=$env:RLM_VERSION
          -p:AssemblyVersion=$env:RLM_FILE_VERSION
          -p:FileVersion=$env:RLM_FILE_VERSION
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o .\artifacts\publish
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler was not installed." }
          "ISCC_PATH=$iscc" >> $env:GITHUB_ENV
      - name: Compile Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .\artifacts\installer | Out-Null
          & "$env:ISCC_PATH" "/DAppVersion=$env:RLM_VERSION" "/DAppFileVersion=$env:RLM_FILE_VERSION" "/DAppExeSource=$PWD\artifacts\publish\RSS.LabelMaker.exe" .\installer\RSS-Label-Maker.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
          $setup = ".\artifacts\installer\RSS-Label-Maker-Setup.exe"
          if (!(Test-Path $setup)) { throw "Installer output was not produced." }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RSS-Label-Maker-Setup.exe" | Set-Content "$setup.sha256" -NoNewline
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/installer/RSS-Label-Maker-Setup.exe
            artifacts/installer/RSS-Label-Maker-Setup.exe.sha256
