name: RSS Label Maker Windows Build

on:
  push:
    branches: [feature/account-verification-password-recovery]
    paths:
      - "src/**"
      - "*.sln"
      - ".github/workflows/rlm-windows-build.yml"
      - ".github/workflows/rlm-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rlm-windows-build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore RSS.LabelMaker.sln
      - name: Build Release
        run: dotnet build RSS.LabelMaker.sln --configuration Release --no-restore
      - name: Publish Windows x64 test package
        run: dotnet publish src/RSS.LabelMaker.App/RSS.LabelMaker.App.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/RSS-Label-Maker-win-x64
      - name: Validate updater package contents
        shell: pwsh
        run: |
          $publish = "artifacts/RSS-Label-Maker-win-x64"
          foreach ($file in @("RSS.LabelMaker.exe", "RSS.LabelMaker.dll")) {
            if (!(Test-Path (Join-Path $publish $file))) { throw "Required updater package file missing: $file" }
          }
          $runtimeConfig = Join-Path $publish "RSS.LabelMaker.runtimeconfig.json"
          if (!(Test-Path $runtimeConfig)) { throw "Runtime configuration missing from self-contained package." }
      - name: Upload Windows x64 test package
        uses: actions/upload-artifact@v4
        with:
          name: RSS-Label-Maker-Windows-x64
          path: artifacts/RSS-Label-Maker-win-x64/
          if-no-files-found: error
          retention-days: 7
