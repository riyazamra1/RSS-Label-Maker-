name: RSS Label Maker Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: rlm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RSS.LabelMaker.sln

      - name: Build Release
        run: dotnet build RSS.LabelMaker.sln --configuration Release --no-restore

      - name: Publish Windows x64
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v', 'V')
          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') { throw "Use a numeric version tag such as v1.0.1 or v1.0.1.0." }
          $assemblyVersion = if (($version.Split('.')).Length -eq 3) { "$version.0" } else { $version }
          dotnet publish src/RSS.LabelMaker.App/RSS.LabelMaker.App.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/publish "-p:Version=$version" "-p:FileVersion=$version" "-p:AssemblyVersion=$assemblyVersion"

      - name: Package and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path "artifacts/publish/*" -DestinationPath "artifacts/RSS-Label-Maker-win-x64.zip" -CompressionLevel Optimal
          $hash = (Get-FileHash "artifacts/RSS-Label-Maker-win-x64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RSS-Label-Maker-win-x64.zip" | Out-File -FilePath "artifacts/RSS-Label-Maker-win-x64.zip.sha256" -Encoding ascii

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: RSS Label Maker ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            artifacts/RSS-Label-Maker-win-x64.zip
            artifacts/RSS-Label-Maker-win-x64.zip.sha256
