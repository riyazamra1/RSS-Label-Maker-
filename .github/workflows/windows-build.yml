name: Windows x64 Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build RSS Label Maker (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show .NET SDK
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore .\\RSS.LabelMaker.sln -r win-x64

      - name: Build Release
        run: dotnet build .\RSS.LabelMaker.sln -c Release --no-restore

      - name: Publish self-contained Windows x64 executable
        run: >-
          dotnet publish .\src\RSS.LabelMaker.App\RSS.LabelMaker.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o .\artifacts\publish

      - name: Verify published executable
        shell: pwsh
        run: |
          $exe = ".\artifacts\publish\RSS.LabelMaker.exe"
          if (!(Test-Path $exe)) {
            throw "Expected executable was not produced: $exe"
          }
          Get-Item $exe | Format-List Name,Length,LastWriteTime
          Get-ChildItem .\artifacts\publish | Select-Object Name,Length

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build branded Windows installer
        shell: pwsh
        env:
          RLM_VERSION: 1.0.0
        run: |
          $iscc = "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Installer compiler was not installed: $iscc" }
          New-Item -ItemType Directory -Force .\artifacts\installer | Out-Null
          & $iscc /DRLM_VERSION=$env:RLM_VERSION .\installer\RSS-Label-Maker.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed with exit code $LASTEXITCODE" }
          $setup = Get-ChildItem .\artifacts\installer\RSS-Label-Maker-Setup-win-x64.exe
          if (!$setup -or $setup.Length -lt 1MB) { throw "Installer output is missing or unexpectedly small." }
          Get-Item $setup.FullName | Format-List Name,Length,LastWriteTime

      - name: Upload Windows x64 build and installer
        uses: actions/upload-artifact@v4
        with:
          name: RSS-Label-Maker-Windows-x64
          path: |
            .\artifacts\publish\
            .\artifacts\installer\RSS-Label-Maker-Setup-win-x64.exe
          if-no-files-found: error
          retention-days: 14
